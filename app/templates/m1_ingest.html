{% extends "base.html" %}{% block content %}<div class="slips"><section class="panel wide"><header><h2>检测报告原件</h2><span>{{data.encoding}}</span></header><div class="scroll"><table><thead><tr><th>行</th><th>样本</th><th>项目</th><th>结果</th><th>单位</th><th>LOD</th><th>采样日</th></tr></thead><tbody>{% for r in data.rows %}<tr><td class="num">{{r._line}}</td><td>{{r.sample_id}}</td><td>{{r.analyte}}</td><td class="num">{{r.result}}</td><td>{{r.unit}}</td><td class="num">{{r.lod}}</td><td>{{r.sampled}}</td></tr>{% endfor %}</tbody></table></div></section><section class="panel intake-slip"><header><h2>接收记录</h2></header><form id="lab-source"><label>样例<select name="sample"><option>dirty.csv</option><option>clean.csv</option><option>legacy.csv</option></select></label><label>CSV报告<textarea name="csv" rows="4" placeholder="粘贴检测报告"></textarea></label><button>提交复核</button></form></section>{% include "quarantine_slip.html" %}</div>{% endblock %}
