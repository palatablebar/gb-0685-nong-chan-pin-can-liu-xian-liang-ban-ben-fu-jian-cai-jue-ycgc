<section class="panel quarantine-slip"><header><h2>隔离签</h2><span>{{data.quarantine|length}} 条</span></header><div class="scroll"><table><thead><tr><th>行</th><th>报告ID</th><th>原因</th></tr></thead><tbody>{% for q in data.quarantine %}<tr><td class="num">{{q.line}}</td><td>{{q.id}}</td><td><span class="reject" title="{{q.raw}}">{{q.code}}</span></td></tr>{% else %}<tr><td colspan="3">无隔离报告</td></tr>{% endfor %}</tbody></table></div><div class="slip-tail">证据 / SOURCE</div></section>
